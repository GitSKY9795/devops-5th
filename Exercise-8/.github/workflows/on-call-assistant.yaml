name: On-Call Assistant

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  analyze:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
    if: ${{ always() && (needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure') }}
    outputs:
      is-recurring: ${{ steps.sensethelog.outputs.is-recurring }}
      error-signature: ${{ steps.sensethelog.outputs.error-signature }}
    steps:
      - name: Analyze failed jobs with SenseTheLog
        id: sensethelog
        uses: sensethelog/action@v1
        with:
          sensethelog-api-key: ${{ secrets.SENSETHELOG_API_KEY }}

      - name: Print SenseTheLog recurrence fields
        run: |
          echo "is-recurring=${{ steps.sensethelog.outputs.is-recurring }}"
          echo "error-signature=${{ steps.sensethelog.outputs.error-signature }}"

  notify-on-recurrence:
    runs-on: ubuntu-latest
    needs:
      - analyze
    if: ${{ needs.analyze.outputs.is-recurring == 'true' }}
    steps:
      - name: Print recurrence notification
        run: echo "This exact failure has happened before; treat it as a priority fix rather than re-run and forgotten."
